[package]
name = "promissory-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
zcash_client_backend.workspace = true
zcash_client_sqlite.workspace = true
zcash_primitives.workspace = true
zcash_protocol.workspace = true
zcash_keys.workspace = true
pczt.workspace = true
orchard.workspace = true
tlock_age.workspace = true
drand_core.workspace = true
tonic.workspace = true
tokio.workspace = true
async-trait.workspace = true
rand.workspace = true
secrecy.workspace = true
hex.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = "0.37"
zcash_address = "0.14"
zcash_note_encryption = "0.5"
uuid = "1"
zip321 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
tracing = "0.1"
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
hyper = { version = "1", optional = true }

[features]
default = []
# Route lightwalletd, keeper and drand traffic over Tor (arti, via zcash_client_backend).
tor = [
    "zcash_client_backend/tor",
    "zcash_client_backend/lightwalletd-tonic-tls-webpki-roots",
    "dep:http-body-util",
    "dep:bytes",
    "dep:hyper",
]

[dev-dependencies]
zip32 = "0.3"
