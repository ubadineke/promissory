[package]
name = "promissory-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "MCP server (stdio) that lets AI agents use Promissory allowances through promissory-app"

[dependencies]
rmcp = { version = "3.6", default-features = false, features = ["server", "transport-io"] }
tokio = { workspace = true, features = ["io-std", "io-util", "sync"] }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { workspace = true, features = ["io-std", "io-util", "sync", "process", "net"] }
